<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knockout Stage - ZPL Football Tournament</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body id="knockout-page">
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">ZPL 2026</a>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="teams.html">Team Names</a></li>
                <li><a href="standings.html">Group Standing</a></li>
                <li><a href="knockout.html">Knockout Stage</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <h1 class="section-title">Knockout Stage</h1>

                <div id="champion-container" style="margin-bottom: 3rem;">
                    <!-- Champion will be shown here if tournament is finished -->
                </div>

                <div class="bracket-container">
                    <div class="round">
                        <h3 class="round-title">Semi Finals</h3>
                        <div id="sf-container" style="display: flex; flex-direction: column; gap: 2rem;"></div>
                    </div>
                    <div class="round">
                        <h3 class="round-title">Final</h3>
                        <div id="f-container" style="display: flex; flex-direction: column; gap: 2rem;"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container footer-content">
            <h3 id="footer-department"></h3>
            <p id="footer-committee"></p>
            <p id="footer-contact" style="color: var(--text-secondary);"></p>
            <div class="footer-links">
                <a href="#" id="footer-facebook" target="_blank">Facebook Page</a>
            </div>
            <p id="footer-copyright" style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 1rem;"></p>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/knockout.js"></script>
</body>

</html>
